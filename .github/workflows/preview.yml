name: Typed preview checks
on:
  push:
    branches: [codex/typed-flowcharts-preview]
  pull_request:
  workflow_dispatch:
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: python -m unittest discover -v
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:browser
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site run check
      - run: npm --prefix docs-site run examples
      - run: npm --prefix docs-site run build
      - run: npm --prefix docs-site run build:pages
      - run: npm --prefix docs-site run test:browser
      - run: python -m build
      - name: Verify bundled documentation from clean wheel
        run: |
          python -m venv "$RUNNER_TEMP/workbench-docs-wheel"
          "$RUNNER_TEMP/workbench-docs-wheel/bin/python" -m pip install dist/*.whl
          python docs-site/scripts/check_installed.py --python "$RUNNER_TEMP/workbench-docs-wheel/bin/python"
      - run: npm --prefix npm/workbench test
      - run: cd npm/workbench && npm pack
