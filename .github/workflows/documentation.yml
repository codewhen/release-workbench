name: Documentation preview and optional Pages deployment
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (requires repository Pages configuration)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: python -m pip install -e .
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site run check
      - run: npm --prefix docs-site run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
