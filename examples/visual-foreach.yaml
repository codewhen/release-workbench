%YAML 1.2
---
version: 2
name: Visual Foreach
concurrency: 4
inputs: {}
steps:
  - id: items
    name: Items
    kind: foreach
    needs: []
    control:
      items:
        - first
        - second
        - third
      parallel: 1
      limit: 100
      timeout: 1800
    position:
      x: 0
      y: 0
    size:
      width: 840
      height: 760
  - id: show
    name: Process current item
    kind: command
    scope: items
    commands:
      - argv:
          - ${python}
          - -c
          - import sys;print(sys.argv[1])
          - ${loop.item}
    position:
      x: 40
      y: 90
