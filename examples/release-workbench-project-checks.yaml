%YAML 1.2
---
version: 1
name: project-checks
concurrency: 4
inputs: {}
steps:
  - id: probe
    name: Inspect this project
    kind: command
    needs: []
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - import 
            json,pathlib;p=list(pathlib.Path(".").glob("*.py"));print(json.dumps({"ready":bool(p),"python_files":len(p)}))
    capture: json
    position:
      x: 0
      y: 0
  - id: choose
    name: If ready
    kind: condition
    needs:
      - probe
    condition:
      source: steps.probe.result.json.ready
      operator: is_true
    position:
      x: 310
      y: 0
  - id: ready
    name: 'True: check Python syntax'
    kind: command
    needs:
      - choose
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - import 
            ast,pathlib;files=list(pathlib.Path(".").glob("*.py"));[ast.parse(p.read_text(),filename=str(p))
            for p in files];print("Parsed",len(files),"Python files")
    when:
      step: choose
      equals: true
    position:
      x: 620
      y: 0
  - id: waiting
    name: 'False: no Python files'
    kind: command
    needs:
      - choose
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - print("No root Python files. Add checks for your project language.")
    when:
      step: choose
      equals: false
    position:
      x: 620
      y: 180
  - id: finish
    name: Join the chosen path
    kind: command
    needs:
      - ready
      - waiting
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - print("Chosen path completed")
    join: any
    position:
      x: 930
      y: 0
