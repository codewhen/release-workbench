%YAML 1.2
---
version: 1
name: If(a) computation
concurrency: 4
inputs: {}
steps:
  - id: choose
    name: 'If(a): compute readiness'
    kind: condition
    needs: []
    condition:
      compute:
        commands:
          - argv:
              - ${python}
              - -c
              - import json; print(json.dumps(2 + 2 == 4))
    position:
      x: 0
      y: 0
  - id: ready
    name: 'True: process ready data'
    kind: command
    needs:
      - choose
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - print("Ready path selected")
    when:
      step: choose
      equals: true
    position:
      x: 310
      y: 0
  - id: waiting
    name: 'False: defer processing'
    kind: command
    needs:
      - choose
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - print("Waiting path selected")
    when:
      step: choose
      equals: false
    position:
      x: 310
      y: 180
  - id: finish
    name: Join the chosen path
    kind: command
    needs:
      - ready
      - waiting
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - print("Chosen path completed")
    join: any
    position:
      x: 620
      y: 0
