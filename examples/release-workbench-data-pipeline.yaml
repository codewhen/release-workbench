%YAML 1.2
---
version: 1
name: data-pipeline
concurrency: 4
inputs: {}
steps:
  - id: prepare
    name: Create sample CSV
    kind: command
    needs: []
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - from pathlib import 
            Path;p=Path(".workbench/demo");p.mkdir(parents=True,exist_ok=True);(p/"input.csv").write_text("name,amount\nAlpha,10\nBeta,20\n")
    reports:
      - .workbench/demo/input.csv
    position:
      x: 0
      y: 0
  - id: transform
    name: Read CSV and calculate total
    kind: command
    needs:
      - prepare
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - import csv,json;from pathlib import 
            Path;rows=list(csv.DictReader(Path(".workbench/demo/input.csv").open()));data={"rows":len(rows),"total":sum(int(r["amount"])
            for r in 
            rows)};Path(".workbench/demo/result.json").write_text(json.dumps(data));print(json.dumps(data))
    capture: json
    reports:
      - .workbench/demo/result.json
    position:
      x: 310
      y: 0
  - id: check
    name: If data is present
    kind: condition
    needs:
      - transform
    condition:
      source: steps.transform.result.json.rows
      operator: greater_than
      value: 0
    position:
      x: 620
      y: 0
  - id: publish
    name: 'True: prepare summary'
    kind: command
    needs:
      - check
    mode: background
    commands:
      - argv:
          - ${python}
          - -c
          - print("Sample data processed; inspect result.json in evidence")
    when:
      step: check
      equals: true
    position:
      x: 930
      y: 0
