%YAML 1.2
---
version: 2
name: Visual While
concurrency: 4
inputs: {}
steps:
  - id: counter
    name: Counter
    kind: declare
    needs: []
    control:
      name: count
      value: 0
    position:
      x: 0
      y: 0
  - id: repeat
    name: Repeat
    kind: while
    needs:
      - counter
    control:
      test:
        source: vars.count
        operator: less_than
        value: 3
      limit: 100
      timeout: 1800
      outputs:
        count: ${vars.count}
    position:
      x: 340
      y: 0
    size:
      width: 840
      height: 760
  - id: increment
    name: Increment
    kind: update
    needs: []
    control:
      name: count
      value: 1
    scope: repeat
    region: body
    position:
      x: 40
      y: 370
