%YAML 1.2
---
version: 2
name: Visual Recovery
concurrency: 4
inputs: {}
steps:
  - id: recover
    name: Recover
    kind: try
    needs: []
    control: {}
    position:
      x: 0
      y: 0
    size:
      width: 840
      height: 760
  - id: failure
    name: Demonstrate failure
    kind: command
    scope: recover
    commands:
      - argv:
          - ${python}
          - -c
          - raise RuntimeError("demonstration")
    position:
      x: 40
      y: 90
  - id: handle
    name: Handle
    kind: handle_error
    needs: []
    control: {}
    scope: recover
    region: catch
    position:
      x: 40
      y: 320
  - id: cleanup
    name: Cleanup
    kind: wait
    needs: []
    control:
      delay: 0.1
    scope: recover
    region: finally
    position:
      x: 40
      y: 550
