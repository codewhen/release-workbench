%YAML 1.2
---
version: 1
name: no-code
concurrency: 4
inputs: {}
steps:
  - id: values
    name: Set starting values
    kind: action
    action:
      type: set_values
      values:
        amount: 3
        message: Sample automation
    position:
      x: 0
      y: 0
  - id: calculate
    name: Calculate double
    kind: action
    needs:
      - values
    action:
      type: calculate
      left: ${steps.values.result.json.amount}
      right: 2
      operator: multiply
    position:
      x: 310
      y: 0
  - id: choose
    name: If the result is positive
    kind: condition
    needs:
      - calculate
    condition:
      source: steps.calculate.result.json.value
      operator: greater_than
      value: 0
    position:
      x: 620
      y: 0
  - id: save
    name: 'True: save sample JSON'
    kind: action
    needs:
      - choose
    when:
      step: choose
      equals: true
    action:
      type: write_file
      path: .workbench/demo/no-code.json
      content: ${steps.calculate.result.json}
      format: json
      create_directories: true
      overwrite: true
    position:
      x: 930
      y: 0
  - id: review
    name: 'False: review values'
    kind: manual
    needs:
      - choose
    when:
      step: choose
      equals: false
    description: Inspect the result and record why it is not positive.
    position:
      x: 930
      y: 180
  - id: read
    name: Read the saved result
    kind: action
    needs:
      - save
    action:
      type: read_json
      path: .workbench/demo/no-code.json
    position:
      x: 1240
      y: 0
