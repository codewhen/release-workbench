version: 3
name: 'Repeat count: three iterations'
concurrency: 4
inputs: {}
globals: {}
functions: {}
graphs:
  main:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: loop
        kind: loop
        name: Loop
        config:
          mode: count
          count: 3
      - id: work
        kind: wait
        name: Work
        config:
          seconds: 0.05
        owner:
          card: loop
          region: body
      - id: finish
        kind: finish
        name: Finish
        config: {}
    edges:
      - id: start:next:loop:entry
        source: start
        target: loop
        source_port: next
        target_port: entry
        kind: flow
      - id: loop:body:work:entry
        source: loop
        target: work
        source_port: body
        target_port: entry
        kind: flow
      - id: work:next:loop:next_iteration
        source: work
        target: loop
        source_port: next
        target_port: next_iteration
        kind: flow
      - id: loop:done:finish:entry
        source: loop
        target: finish
        source_port: done
        target_port: entry
        kind: flow
layout:
  main:
    positions:
      start:
        x: 0
        y: 0
      loop:
        x: 340
        y: 0
      finish:
        x: 680
        y: 0
      work:
        x: 340
        y: 380
    areas: []
