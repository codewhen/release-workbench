version: 3
name: 'Card: Call function'
concurrency: 4
inputs: {}
globals: {}
functions:
  greet:
    name: Compose greeting
    graph: greeting
    inputs:
      name:
        type: string
    returns: string
graphs:
  main:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: operation
        kind: call
        name: Operation
        config:
          function: greet
        inputs:
          name: Reader
      - id: finish
        kind: finish
        name: Finish
        config:
          returns: json
          value:
            $ref: card:operation
    edges:
      - id: start:next:operation:entry
        source: start
        target: operation
        source_port: next
        target_port: entry
        kind: flow
      - id: operation:next:finish:entry
        source: operation
        target: finish
        source_port: next
        target_port: entry
        kind: flow
  greeting:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: compose
        kind: python
        name: Compose
        config:
          code: return "Hello " + inputs["name"]
          returns: string
        inputs:
          name:
            $ref: input:name
      - id: return
        kind: return
        name: Return
        config:
          returns: string
          value:
            $ref: card:compose
    edges:
      - id: start:next:compose:entry
        source: start
        target: compose
        source_port: next
        target_port: entry
        kind: flow
      - id: compose:next:return:entry
        source: compose
        target: return
        source_port: next
        target_port: entry
        kind: flow
layout:
  main:
    positions:
      start:
        x: 0
        y: 0
      operation:
        x: 340
        y: 0
      finish:
        x: 680
        y: 0
    areas: []
  greeting:
    positions:
      start:
        x: 0
        y: 0
      compose:
        x: 340
        y: 0
      return:
        x: 680
        y: 0
    areas: []
