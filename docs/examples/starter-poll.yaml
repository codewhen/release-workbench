version: 3
name: 'Starter: Poll for a file'
concurrency: 4
inputs: {}
globals: {}
functions:
  ready:
    name: File is ready
    graph: probe
    inputs: {}
    returns: boolean
graphs:
  main:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: poll
        kind: poll
        name: Poll
        config:
          function: ready
          interval: 0.2
          timeout: 10
      - id: finish
        kind: finish
        name: Finish
        config: {}
    edges:
      - id: start:next:poll:entry
        source: start
        target: poll
        source_port: next
        target_port: entry
        kind: flow
      - id: poll:next:finish:entry
        source: poll
        target: finish
        source_port: next
        target_port: entry
        kind: flow
  probe:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: check
        kind: check_path
        name: Check
        config:
          path: ready.txt
          type: file
      - id: return
        kind: return
        name: Return
        config:
          value:
            $ref: card:check
    edges:
      - id: start:next:check:entry
        source: start
        target: check
        source_port: next
        target_port: entry
        kind: flow
      - id: check:next:return:entry
        source: check
        target: return
        source_port: next
        target_port: entry
        kind: flow
layout:
  main:
    positions:
      start:
        x: 0
        y: 0
      poll:
        x: 340
        y: 0
      finish:
        x: 680
        y: 0
    areas: []
  probe:
    positions:
      start:
        x: 0
        y: 0
      check:
        x: 340
        y: 0
      return:
        x: 680
        y: 0
    areas: []
