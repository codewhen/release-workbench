version: 3
name: 'Starter: While with a Boolean function'
concurrency: 4
inputs: {}
globals:
  count:
    type: number
    initial: 0
functions:
  below-limit:
    name: Count below three
    graph: condition
    inputs: {}
    returns: boolean
graphs:
  main:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: repeat
        kind: loop
        name: Repeat
        config:
          mode: while
          function: below-limit
      - id: increment
        kind: variable
        name: Increment
        config:
          name: count
          operation: update
          operator: add
          value: 1
        owner:
          card: repeat
          region: body
      - id: finish
        kind: finish
        name: Finish
        config: {}
    edges:
      - id: start:next:repeat:entry
        source: start
        target: repeat
        source_port: next
        target_port: entry
        kind: flow
      - id: repeat:body:increment:entry
        source: repeat
        target: increment
        source_port: body
        target_port: entry
        kind: flow
      - id: increment:next:repeat:next_iteration
        source: increment
        target: repeat
        source_port: next
        target_port: next_iteration
        kind: flow
      - id: repeat:done:finish:entry
        source: repeat
        target: finish
        source_port: done
        target_port: entry
        kind: flow
  condition:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: get-count
        kind: variable
        name: Get Count
        config:
          name: count
          operation: get
      - id: compare
        kind: calculate
        name: Compare
        config:
          operator: less_than
          left:
            $ref: card:get-count
          right: 3
      - id: return
        kind: return
        name: Return
        config:
          value:
            $ref: card:compare
    edges:
      - id: start:next:get-count:entry
        source: start
        target: get-count
        source_port: next
        target_port: entry
        kind: flow
      - id: get-count:next:compare:entry
        source: get-count
        target: compare
        source_port: next
        target_port: entry
        kind: flow
      - id: compare:next:return:entry
        source: compare
        target: return
        source_port: next
        target_port: entry
        kind: flow
layout:
  main:
    positions:
      start:
        x: 0
        y: 0
      repeat:
        x: 340
        y: 0
      finish:
        x: 680
        y: 0
      increment:
        x: 340
        y: 380
    areas: []
  condition:
    positions:
      start:
        x: 0
        y: 0
      get-count:
        x: 340
        y: 0
      compare:
        x: 680
        y: 0
      return:
        x: 1020
        y: 0
    areas: []
