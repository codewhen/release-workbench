version: 3
name: 'Card: If / Else'
concurrency: 4
inputs: {}
globals: {}
functions:
  approved:
    name: Ask for approval
    graph: approval
    inputs: {}
    returns: boolean
graphs:
  main:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: decision
        kind: if
        name: Decision
        config:
          function: approved
      - id: work
        kind: wait
        name: Work
        config:
          seconds: 0.1
      - id: finish
        kind: finish
        name: Finish
        config: {}
    edges:
      - id: start:next:decision:entry
        source: start
        target: decision
        source_port: next
        target_port: entry
        kind: flow
      - id: decision:true:work:entry
        source: decision
        target: work
        source_port: 'true'
        target_port: entry
        kind: flow
      - id: decision:false:finish:entry
        source: decision
        target: finish
        source_port: 'false'
        target_port: entry
        kind: flow
      - id: work:next:finish:entry
        source: work
        target: finish
        source_port: next
        target_port: entry
        kind: flow
  approval:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: ask
        kind: python
        name: Ask
        config:
          code: return True
          returns: boolean
      - id: return
        kind: return
        name: Return
        config:
          value:
            $ref: card:ask
    edges:
      - id: start:next:ask:entry
        source: start
        target: ask
        source_port: next
        target_port: entry
        kind: flow
      - id: ask:next:return:entry
        source: ask
        target: return
        source_port: next
        target_port: entry
        kind: flow
layout:
  main:
    positions:
      start:
        x: 0
        y: 0
      decision:
        x: 340
        y: 0
      work:
        x: 680
        y: 0
      finish:
        x: 1020
        y: 0
    areas: []
  approval:
    positions:
      start:
        x: 0
        y: 0
      ask:
        x: 340
        y: 0
      return:
        x: 680
        y: 0
    areas: []
