version: 3
name: 'Starter: Failure recovery and cleanup'
concurrency: 4
inputs: {}
globals: {}
functions: {}
graphs:
  main:
    cards:
      - id: start
        kind: start
        name: Start
        config: {}
      - id: recover
        kind: try
        name: Recover
        config: {}
      - id: failure
        kind: python
        name: Failure
        config:
          code: raise ValueError("Demonstration failure")
        owner:
          card: recover
          region: body
      - id: body-end
        kind: return
        name: Body End
        config: {}
        owner:
          card: recover
          region: body
      - id: catch-end
        kind: return
        name: Catch End
        config:
          value: Recovered
          handled: true
        owner:
          card: recover
          region: catch
      - id: cleanup
        kind: wait
        name: Cleanup
        config:
          seconds: 0.1
        owner:
          card: recover
          region: finally
      - id: finally-end
        kind: return
        name: Finally End
        config: {}
        owner:
          card: recover
          region: finally
      - id: finish
        kind: finish
        name: Finish
        config: {}
    edges:
      - id: start:next:recover:entry
        source: start
        target: recover
        source_port: next
        target_port: entry
        kind: flow
      - id: recover:body:failure:entry
        source: recover
        target: failure
        source_port: body
        target_port: entry
        kind: flow
      - id: failure:next:body-end:entry
        source: failure
        target: body-end
        source_port: next
        target_port: entry
        kind: flow
      - id: recover:catch:catch-end:entry
        source: recover
        target: catch-end
        source_port: catch
        target_port: entry
        kind: flow
      - id: recover:finally:cleanup:entry
        source: recover
        target: cleanup
        source_port: finally
        target_port: entry
        kind: flow
      - id: cleanup:next:finally-end:entry
        source: cleanup
        target: finally-end
        source_port: next
        target_port: entry
        kind: flow
      - id: recover:done:finish:entry
        source: recover
        target: finish
        source_port: done
        target_port: entry
        kind: flow
layout:
  main:
    positions:
      start:
        x: 0
        y: 0
      recover:
        x: 340
        y: 0
      finish:
        x: 680
        y: 0
      failure:
        x: 340
        y: 380
      body-end:
        x: 680
        y: 380
      catch-end:
        x: 340
        y: 760
      cleanup:
        x: 340
        y: 1140
      finally-end:
        x: 680
        y: 1140
    areas: []
