[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-workbench"
version = "0.7.0"
description = "Local workflow canvas, parallel test runner and release evidence workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "CodeWhen"}]
dependencies = ["ruamel.yaml>=0.18,<0.20", "jsonschema>=4.23,<5", "psutil>=6,<8"]

[project.urls]
Repository = "https://github.com/codewhen/release-workbench"
Documentation = "https://github.com/codewhen/release-workbench/tree/main/docs"

[project.scripts]
release-workbench = "release_workbench.cli:main"
workflow-workbench = "release_workbench.cli:main"

[tool.setuptools.package-data]
release_workbench = ["schema.json", "NOTICE.txt", "static/**/*", "static/*"]
